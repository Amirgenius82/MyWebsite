<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سایت من</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, sans-serif;
            background: #0f172a;
            color: white;
        }

        nav {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
            background: #111827;
        }

        .logo img {
            width: 55px;
            height: 55px;
            object-fit: contain;
        }

        nav div:last-child {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 17px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #38bdf8;
        }

        .hero {
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .hero-content {
            max-width: 750px;
        }

        .hero h1 {
            font-size: 55px;
            margin-bottom: 20px;
            color: #38bdf8;
        }

        .hero p {
            font-size: 21px;
            line-height: 2;
            color: #cbd5e1;
        }

        .buttons {
            margin-top: 35px;
        }

        .btn {
            display: inline-block;
            padding: 14px 28px;
            margin: 8px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-primary {
            background: #38bdf8;
            color: #0f172a;
        }

        .btn-secondary {
            border: 2px solid #38bdf8;
            color: #38bdf8;
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #111827;
            color: #94a3b8;
        }

        @media (max-width: 600px) {

            nav {
                padding: 0 20px;
            }

            nav div:last-child {
                gap: 10px;
            }

            nav a {
                font-size: 13px;
            }

            .hero h1 {
                font-size: 38px;
            }

            .hero p {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <nav>

        <div class="logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo">
        </div>

        <div>
            <a href="/">خانه</a>
            <a href="/about">درباره من</a>
            <a href="/contact">تماس با من</a>
        </div>

    </nav>


    <section class="hero">

        <div class="hero-content">

            <h1>به سایت من خوش آمدید 🚀</h1>

            <p>
                این سایت رو با Python و Flask ساختم
                و قراره هر روز حرفه‌ای‌ترش کنم.
            </p>

            <div class="buttons">

                <a class="btn btn-primary" href="/about">
                    درباره من 👤
                </a>

                <a class="btn btn-secondary" href="/contact">
                    تماس با من 📞
                </a>

            </div>

        </div>

    </section>


    <footer>
        ساخته شده با ❤️ و Python
    </footer>

</body>

</html>
